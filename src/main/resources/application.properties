spring.application.name=miapi
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bd_clinica?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# XAMPP trae MariaDB (no MySQL). Con MySQL 8 usa DB_DIALECT=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave del JWT: se lee de la variable de entorno JWT_SECRET (minimo 32 caracteres).
# El valor por defecto es solo para desarrollo local; en produccion define JWT_SECRET.
app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiar-en-produccion}
# Duracion del JWT (corto) y del refresh token (largo)
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
app.jwt.issuer=clinica-nutrivifs
# Las reglas de los formularios (@Pattern, @Min...) se aplican solo a lo que llega por la API
# (@Valid en los controladores). Sin esto Hibernate las aplica también al guardar, y la carga
# inicial falla con productos del catálogo original como "Vetmedin 2.5mg".
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Usuarios de prueba (uno por rol) que crea DataInitializer si no existen.
# Solo para desarrollo y demostracion: en produccion deja app.seed.users=false.
# Las claves siguen las reglas del registro (4 a 13 caracteres y una mayuscula)
# y se pueden cambiar con variables de entorno.
# El admin es el mismo que traia el frontend (src/data/defaultAdmin.ts).
app.seed.users=${SEED_USERS:true}
app.seed.admin.email=admin@duoc.cl
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Acab1312}
app.seed.seller.email=vendedor@duoc.cl
app.seed.seller.password=${SEED_SELLER_PASSWORD:Vende2026}
app.seed.client.email=cliente@duoc.cl
app.seed.client.password=${SEED_CLIENT_PASSWORD:Cliente2026}

# Zona horaria para agrupar ventas por dia y para los filtros de fecha (from/to)
app.timezone=America/Santiago
# Dashboard: productos con este stock o menos aparecen en "lowStock"
app.reports.low-stock-threshold=5

# CORS: desde que origenes (frontend) se puede llamar a la API. Lo usan los @CrossOrigin
# de los controladores. Separa varios con coma. "[*]" acepta cualquier puerto, asi el
# frontend funciona aunque Vite cambie de puerto (5173, 5174...).
# Ej. solo dos puertos: CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
