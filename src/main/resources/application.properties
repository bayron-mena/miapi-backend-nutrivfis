spring.application.name=miapi
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bd_clinica?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# clave oculta, se lee de la variable de entorno JWT_SECRET con minimo 32 caracteres
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
app.jwt.issuer=clinica-nutrivifs